<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#2563eb"/>
  <!-- Calendar grid lines -->
  <rect x="10" y="18" width="44" height="36" rx="4" fill="white" opacity="0.15"/>
  <!-- Top bar of calendar -->
  <rect x="10" y="18" width="44" height="10" rx="4" fill="white" opacity="0.3"/>
  <!-- Calendar rings -->
  <rect x="20" y="13" width="4" height="10" rx="2" fill="white"/>
  <rect x="40" y="13" width="4" height="10" rx="2" fill="white"/>
  <!-- Grid dots -->
  <rect x="15" y="33" width="6" height="5" rx="1" fill="white" opacity="0.8"/>
  <rect x="25" y="33" width="6" height="5" rx="1" fill="#f0ff5a"/>
  <rect x="35" y="33" width="6" height="5" rx="1" fill="white" opacity="0.8"/>
  <rect x="45" y="33" width="4" height="5" rx="1" fill="white" opacity="0.8"/>
  <rect x="15" y="42" width="6" height="5" rx="1" fill="white" opacity="0.8"/>
  <rect x="25" y="42" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="35" y="42" width="6" height="5" rx="1" fill="#4ade80" opacity="0.9"/>
  <rect x="45" y="42" width="4" height="5" rx="1" fill="white" opacity="0.5"/>
</svg>